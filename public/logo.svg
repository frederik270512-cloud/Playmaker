<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Baggrund: mørkeblå → blå, som banen i appen -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Bolden: gul med lys kant øverst til venstre, så den ser rund ud -->
    <radialGradient id="bold" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="0.55" stop-color="#facc15"/>
      <stop offset="1" stop-color="#ca8a04"/>
    </radialGradient>
  </defs>

  <!-- Badge -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="2"/>

  <!-- Stiplet afleveringsbue rundt om bolden, med pilespids (som pilene i systemerne) -->
  <path d="M 30 92 A 40 40 0 1 1 98 92" fill="none" stroke="#e2e8f0" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="7 7"/>
  <polygon points="104,84 96,100 90,86" fill="#e2e8f0"/>

  <!-- Bolden -->
  <circle cx="64" cy="64" r="28" fill="url(#bold)" stroke="#0f172a" stroke-width="3"/>

  <!-- Sømmene danner et "P" -->
  <path d="M 56 84 L 56 46 L 68 46 A 10 10 0 0 1 68 66 L 56 66"
        fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- To buede sømme, så det stadig ligner en håndbold -->
  <path d="M 38 56 Q 46 64 38 74" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 90 56 Q 82 64 90 74" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
</svg>
